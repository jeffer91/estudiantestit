name: Reactivar corrección de estadísticas

on:
  push:
    paths:
      - '.github/workflows/reactivar-correccion-estadisticas.yml'

permissions:
  contents: write

jobs:
  reactivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Alinear versión de interfaz y reactivar corrección
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('administrador/ad-js/ad-version.js')
          s = p.read_text(encoding='utf-8')
          old = "var VERSION='3.6.0';"
          if old not in s:
              raise SystemExit('No se encontró la versión 3.6.0 en ad-version.js')
          p.write_text(s.replace(old, "var VERSION='3.6.3';", 1), encoding='utf-8')

          wf = Path('.github/workflows/corregir-auditoria-estadisticas.yml')
          body = wf.read_text(encoding='utf-8')
          marker = '# reintento con versión de interfaz alineada\n'
          if marker not in body:
              wf.write_text(body + '\n' + marker, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reactivar-correccion-estadisticas.yml
          git add administrador/ad-js/ad-version.js .github/workflows/corregir-auditoria-estadisticas.yml
          git commit -m "Alinea versión para auditoría de estadísticas"
          git push origin HEAD:main
