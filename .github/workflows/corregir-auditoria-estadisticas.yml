name: Corregir auditoría de estadísticas

on:
  push:
    paths:
      - '.github/workflows/corregir-auditoria-estadisticas.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar correcciones auditadas
        run: node dev/aplicar-correccion-estadisticas.mjs

      - name: Ejecutar auditoría completa
        run: npm run check

      - name: Construir aplicaciones
        run: |
          npm run build:estudiantes
          npm run build:coordinadores
          npm run build:investigadores
          npm run build:administrador

      - name: Guardar correcciones
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm dev/aplicar-correccion-estadisticas.mjs
          git add -A
          git reset .github/workflows/corregir-auditoria-estadisticas.yml || true
          git reset .github/workflows/reactivar-correccion-estadisticas.yml || true
          if git diff --cached --quiet; then
            echo "No hay cambios para guardar."
            exit 0
          fi
          git commit -m "Corrige auditoría de estadísticas y trazabilidad"
          git push origin HEAD:main
