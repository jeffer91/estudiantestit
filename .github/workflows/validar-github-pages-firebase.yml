name: Validar GitHub Pages con backend Firebase

on:
  push:
    branches:
      - github-pages-usar-firebase-backend
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validar constructor
        run: node --check dev/preparar-github-pages.mjs

      - name: Construir GitHub Pages
        run: node dev/preparar-github-pages.mjs

      - name: Verificar cinco pantallas y runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f .pages-github/estudiantes/index.html
          test -f .pages-github/trabajo-titulacion/index.html
          test -f .pages-github/coordinadores/index.html
          test -f .pages-github/investigadores/index.html
          test -f .pages-github/administrador/index.html
          test -f .pages-github/assets/runtime-config.js
          test -f .pages-github/assets/firebase-auth-client.js
          grep -q "cloudfunctions.net" .pages-github/estudiantes/index.html
          grep -q "cloudfunctions.net" .pages-github/trabajo-titulacion/index.html
          grep -q "firebase-auth-client.js" .pages-github/coordinadores/index.html
          grep -q "firebase-auth-client.js" .pages-github/administrador/index.html
          if grep -R -E "pages\\.dev|workers\\.dev|[Cc]loudflare|script\\.google\\.com" .pages-github --include='*.html' --include='*.js' --include='*.css' --include='*.json'; then
            echo "Se encontraron dependencias de Cloudflare en el artefacto." >&2
            exit 1
          fi
          if grep -R "firestore.googleapis.com" .pages-github --include='*.html' --include='*.js' --include='*.json'; then
            echo "Se encontró acceso directo a Firestore en el frontend." >&2
            exit 1
          fi
          if grep -R "cloudfunctions.nethttps://" .pages-github --include='*.html' --include='*.js' --include='*.json'; then
            echo "Se encontró una URL doble del backend Firebase." >&2
            exit 1
          fi
          if grep -R -E "(apiBase|base)\\(\\)[[:space:]]*\\+[[:space:]]*['\\\"]https://" .pages-github --include='*.js'; then
            echo "Se encontró una concatenación incorrecta base()+URL absoluta." >&2
            exit 1
          fi
          grep -q "investigacionEndpoint()" .pages-github/investigadores/js/investigadores.app.js
          grep -q "window.TITULOS_API_BASE" .pages-github/estudiantes/js/ia.providers.service.js
          grep -q "return apiBase()+'/api/ia'" .pages-github/estudiantes/js/ia.providers.service.js
          grep -q "window.addEventListener('pagehide',liberarAlSalir)" .pages-github/investigadores/js/investigadores.app.js
          grep -q "'Content-Type':'text/plain;charset=UTF-8'" .pages-github/investigadores/js/investigadores.app.js
          if grep -R -E "(fetch|sendBeacon)\\([[:space:]]*['\\\"]/api/" .pages-github --include='*.js'; then
            echo "Se encontró una llamada API same-origin en GitHub Pages." >&2
            exit 1
          fi
          if grep -q -E "fetch\\(['\\\"]/api/investigadores|sendBeacon\\(['\\\"]/api/investigadores" .pages-github/investigadores/js/investigadores.app.js; then
            echo "Investigación todavía usa una ruta same-origin." >&2
            exit 1
          fi

      - name: Validar sintaxis de todo el JavaScript publicado
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find .pages-github -type f -name '*.js' -print0)

      - name: Guardar artefacto auditado
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-firebase-audit
          path: .pages-github
          if-no-files-found: error
          include-hidden-files: true
