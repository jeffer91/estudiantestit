name: Publicar GitHub Pages

on:
  push:
    branches:
      - main
      - migracion-github-firebase-v4
    paths:
      - 'estudiantes-mvp/**'
      - 'trabajo-titulacion-mvp/**'
      - 'coordinadores-mvp/**'
      - 'investigadores-mvp/**'
      - 'administrador/**'
      - 'github-pages/**'
      - 'dev/preparar-github-pages.mjs'
      - 'package.json'
      - '.github/workflows/publicar-github-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Construir sitio único
        run: npm run build:github-pages

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .github-pages-site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
