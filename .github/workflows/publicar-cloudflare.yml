name: Publicar en Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publicar-cloudflare-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verificar proyecto
        run: npm run check

      - name: Construir las aplicaciones
        run: |
          npm run build:estudiantes
          npm run build:coordinadores
          npm run build:investigadores
          npm run build:administrador

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Exigir credenciales de Cloudflare
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::No se puede publicar: faltan CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Construir Estudiantes y Trabajo de Titulación
        run: npm run build:estudiantes

      - name: Publicar Estudiantes y Trabajo de Titulación
        run: npx --yes wrangler@4 pages deploy .pages-estudiantes --project-name titulos --branch main --commit-dirty=true

      - name: Construir Coordinadores
        run: npm run build:coordinadores

      - name: Publicar Coordinadores
        run: npx --yes wrangler@4 pages deploy .pages-coordinadores --project-name titulos-coordinadores --branch main --commit-dirty=true

      - name: Construir Investigadores
        run: npm run build:investigadores

      - name: Publicar Investigadores
        run: npx --yes wrangler@4 pages deploy .pages-investigadores --project-name titulos-investigadores --branch main --commit-dirty=true

      - name: Construir Administrador
        run: npm run build:administrador

      - name: Publicar Administrador
        run: npx --yes wrangler@4 pages deploy .pages-administrador --project-name titulos-administrador --branch main --commit-dirty=true

      - name: Verificar sitios publicados
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://titulos.pages.dev/estudiantes/estudiante"
            "https://titulos.pages.dev/trabajo-titulacion/"
            "https://titulos-coordinadores.pages.dev/"
            "https://titulos-investigadores.pages.dev/"
            "https://titulos-administrador.pages.dev/"
          )
          for url in "${urls[@]}"; do
            echo "Comprobando $url"
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              -o /dev/null "$url"
          done

      - name: Verificar API del Administrador
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -H 'Content-Type: application/json' \
            -H 'X-Titulos-App: administrador' \
            --data '{"accion":"ADMIN_LISTAR_PERIODOS","datos":{}}' \
            https://titulos-administrador.pages.dev/api/estadisticas)"
          RESPONSE="$response" node --input-type=module - <<'NODE'
          const raw = process.env.RESPONSE || '';
          let data;
          try { data = JSON.parse(raw); }
          catch { throw new Error('La API del Administrador no devolvió JSON válido.'); }
          if (!data || data.ok === false) {
            throw new Error(data && (data.mensaje || data.message) || 'La API del Administrador respondió con error.');
          }
          console.log('API del Administrador verificada.');
          NODE

      - name: Resumen
        run: |
          echo "Publicación y smoke tests completados:"
          echo "https://titulos.pages.dev/estudiantes/estudiante"
          echo "https://titulos.pages.dev/trabajo-titulacion/"
          echo "https://titulos-coordinadores.pages.dev/"
          echo "https://titulos-investigadores.pages.dev/"
          echo "https://titulos-administrador.pages.dev/"
