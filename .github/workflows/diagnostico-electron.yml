name: Diagnóstico Electron

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Ejecutar validaciones y guardar salida
        shell: bash
        run: |
          set +e
          npm run check > diagnostico-electron.log 2>&1
          echo $? > diagnostico-electron.status
          exit 0

      - name: Publicar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-electron
          path: |
            diagnostico-electron.log
            diagnostico-electron.status
          retention-days: 1
