name: Diagnóstico Electron

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sintaxis
        run: npm run check:syntax

      - name: Aplicaciones
        run: npm run check:apps

      - name: Outlook
        run: npm run check:outlook

      - name: Arquitectura
        run: npm run check:architecture

      - name: Auth - proyectos Firebase
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/firestore.js','utf8');if(!/titulos-ec2fa/.test(s)||!/utet-4387a/.test(s))process.exit(1)"

      - name: Auth - API key Firebase
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/firestore.js','utf8');if(!/apiKey/.test(s)||!/AIza[0-9A-Za-z_-]{20,}/.test(s))process.exit(1)"

      - name: Auth - API pública
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/firestore.js','utf8');if(!/publicApiUrl/.test(s)||!/token \? url : publicApiUrl/.test(s))process.exit(1)"

      - name: Auth - cuenta de servicio
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/firestore.js','utf8');if(!/serviceAccount/.test(s)||!/oauth2\\.googleapis\\.com\\/token/.test(s))process.exit(1)"

      - name: Auth - roles por dominio
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/http.js','utf8');if(!/requestHost/.test(s)||!/titulos-administrador\\.pages\\.dev/.test(s)||!/endsWith\\(['\"]\\.['\"]\\s*\\+\\s*projectHost/.test(s)||/origin\\.includes\\(['\"]titulos-administrador/.test(s))process.exit(1)"

      - name: Auth - API administrador
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('administrador/ad-js/ad-api.service.js','utf8');if(!/window\\.location&&window\\.location\\.origin/.test(s)||/API_PUBLICA=['\"]https:\\/\\/titulos\\.pages\\.dev/.test(s))process.exit(1)"

      - name: Auth - scripts locales
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('package.json','utf8');if(!/wrangler pages dev \\.pages-local/.test(s)||!/deploy:administrador/.test(s))process.exit(1)"

      - name: Auth - caché estudiante
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/api/acceso-estudiante.js','utf8');if(/\\bsetCached\\s*\\(/.test(s)||!/\\.then\\(\\(result\\)\\s*=>\\s*setCache\\(key, result, cedula\\)\\)/.test(s))process.exit(1)"

      - name: Auth - período exacto
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/titulos-firebase.js','utf8');if(!/if \\(requested\\)[\\s\\S]*if \\(!candidates\\.length\\) return null;/.test(s))process.exit(1)"

      - name: Auth - resoluciones atómicas
        continue-on-error: true
        run: node -e "const fs=require('fs');const s=fs.readFileSync('functions/_lib/titulos-firebase.js','utf8');if(!/RESOLUTION_STATES/.test(s)||!/commitDocuments\\('TITULOS'/.test(s))process.exit(1)"

      - name: Firebase Auth completo
        run: npm run check:firebase-auth

      - name: Acceso estudiante
        run: npm run check:access

      - name: Apps Script
        run: npm run check:apps-script

      - name: Electron Administrador
        run: npm run check:electron
