name: Diagnóstico Electron

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sintaxis
        run: npm run check:syntax

      - name: Aplicaciones
        run: npm run check:apps

      - name: Outlook
        run: npm run check:outlook

      - name: Arquitectura
        run: npm run check:architecture

      - name: Firebase Auth
        run: npm run check:firebase-auth

      - name: Acceso estudiante
        run: npm run check:access

      - name: Apps Script
        run: npm run check:apps-script

      - name: Electron Administrador
        run: npm run check:electron
