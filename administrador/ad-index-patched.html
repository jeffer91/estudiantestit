<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <title>Administrador Titulación</title>
</head>
<body>
  <div id="bootstrap-admin" style="font-family:system-ui,sans-serif;padding:24px">Cargando administrador...</div>
  <script>
    (function(){
      fetch('./ad-index.html?source=1',{cache:'no-store'})
        .then(function(response){if(!response.ok)throw new Error('No se pudo cargar el administrador.');return response.text();})
        .then(function(html){
          var patch='<script src="./ad-js/ad-trabajo-titulacion-admin.patch.js?v=3.4.0"><\\/script>';
          html=html.replace('</body>',patch+'</body>');
          document.open();document.write(html);document.close();
        })
        .catch(function(error){document.getElementById('bootstrap-admin').textContent=error.message||String(error);});
    })();
  </script>
</body>
</html>
